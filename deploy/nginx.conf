# /etc/nginx/sites-available/professional_edge  (HTTPS certificate via certbot: see docs/DEPLOYMENT.md)
server {
    listen 80;
    server_name professionaledge.co.zw www.professionaledge.co.zw;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name professionaledge.co.zw www.professionaledge.co.zw;
    # ssl_certificate and ssl_certificate_key lines are added by certbot

    client_max_body_size 6m;          # matches the 5 MB upload limit
    # private_media/ is NOT served by nginx on purpose: files go through permission-checked Django views.

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://unix:/run/pe.sock;
    }
}
